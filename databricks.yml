# yaml-language-server: $schema=bundle_config_schema.json

bundle:
  name: ree_sharepoint_non_fed_cleanup

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog name
    default: ree_edapt
  bronze_schema:
    description: Schema for bronze tables
    default: hr_bronze
  silver_schema:
    description: Schema for silver tables
    default: hr_silver
  gold_schema:
    description: Schema for gold tables
    default: hr


targets:
  dev:
    default: true
    presets:
      name_prefix: "[dev] "
    workspace:
      host: https://dbc-c5bad5e5-3e9c.cloud.databricks.com
    run_as:
      service_principal_name: d8d72d2d-c931-40df-a836-67d884f4522f

  prod:
    mode: production
    workspace:
      host: https://dbc-c5bad5e5-3e9c.cloud.databricks.com
    run_as:
      service_principal_name: d8d72d2d-c931-40df-a836-67d884f4522f
